<app-modal [title]="title" size="lg" (closed)="closed.emit()">
  <p *ngIf="role.description as description" class="text-secondary small mb-3">
    <i class="bi bi-info-circle me-1"></i>{{ description }}
  </p>

  <div class="row g-3">
    <div *ngFor="let permission of role.permissions" class="col-md-6">
      <div
        class="card permission-card h-100"
        [class.permission-card--none]="grantedCount(permission) === 0"
      >
        <div class="card-body">
          <div class="permission-card__header">
            <i class="bi bi-folder2 text-primary"></i>
            <span class="fw-semibold">{{ permission.label }}</span>
            <span class="permission-card__count ms-auto">{{ grantedCount(permission) }}/4</span>
          </div>
          <div class="d-flex flex-wrap gap-2">
            <span
              *ngFor="let flag of flags(permission)"
              class="permission-badge"
              [class.permission-badge--granted]="flag.granted"
            >
              {{ flag.label }}
              <i *ngIf="flag.granted" class="bi bi-check-circle-fill" aria-label="yetkili"></i>
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div modal-footer class="modal-footer">
    <button type="button" class="btn btn-primary" (click)="closed.emit()">Kapat</button>
  </div>
</app-modal>
