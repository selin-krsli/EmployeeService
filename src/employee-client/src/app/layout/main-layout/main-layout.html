<app-header (sidebarToggle)="toggleSidebar()" />
<app-sidebar [open]="sidebarOpen" (navigate)="closeSidebarOnMobile()" />

<div *ngIf="isMobile && sidebarOpen" class="layout-backdrop" (click)="closeSidebarOnMobile()"></div>

<main class="layout-content" [class.layout-content--shifted]="sidebarOpen">
  <div class="container-fluid p-3 p-lg-4">
    <router-outlet />
  </div>
</main>
